script:
  - id: button_hold_script
    mode: restart
    then:
      # Wait 3 seconds - then start slow red blink
      - delay: 3s
      - lambda: |-
          id(front_button_hold_time) = 3000;
          id(red_blink_mode) = 2;
      # Wait 2 more seconds (5s total) - calibration threshold reached
      - delay: 2s
      - lambda: id(front_button_hold_time) = 5000;
      # Wait 2 more seconds (7s total) - fast red blink
      - delay: 2s
      - lambda: |-
          id(front_button_hold_time) = 7000;
          id(red_blink_mode) = 3;
      # Wait 3 more seconds (10s total) - restart device
      - delay: 3s
      - lambda: |-
          id(front_button_hold_time) = 10000;
          id(red_blink_mode) = 0;
          id(yellow_blink_mode) = 0;
      - delay: 500ms
      - button.press: restart_button

  - id: set_filter_exp
    mode: restart
    then: 
    - datetime.date.set:
        id: filter_exp_date
        date: !lambda |-
                  auto now = id(sntp_time).now();
                  now.day_of_month = id(filter_install_date).day;
                  now.month = id(filter_install_date).month;
                  now.year = id(filter_install_date).year ;
                  uint8_t offset = (uint8_t) id(filter_life).state;
                  for (uint8_t i = 0;i< offset; i++)
                    now.increment_day();
                  return now;

