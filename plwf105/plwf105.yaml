interval:
  - interval: 1s
    then:
      - lambda: |-
          // When WiFi is disconnected for 35+ seconds, AP should be active - both LEDs solid
          static int disconnect_seconds = 0;
          if (!wifi::global_wifi_component->is_connected()) {
            disconnect_seconds++;
            if (disconnect_seconds == 35) {
              id(red_blink_mode) = 1;
              id(yellow_blink_mode) = 1;
            }
          } else {
            disconnect_seconds = 0;
          }

  - interval: 100ms
    then:
      - lambda: |-
          static int yellow_counter = 0;
          static int red_counter = 0;
          static bool yellow_state = false;
          static bool red_state = false;
          
          yellow_counter++;
          red_counter++;
          
          // Yellow LED
          if (id(yellow_blink_mode) == 0) {
            id(yellow_led_output).turn_off();
            yellow_counter = 0;
            yellow_state = false;
          } else if (id(yellow_blink_mode) == 1) {
            id(yellow_led_output).turn_on();
            yellow_counter = 0;
          } else if (id(yellow_blink_mode) == 2) {
            if (yellow_counter >= 5) {
              yellow_counter = 0;
              yellow_state = !yellow_state;
              yellow_state ? id(yellow_led_output).turn_on() : id(yellow_led_output).turn_off();
            }
          } else if (id(yellow_blink_mode) == 3) {
            yellow_state = !yellow_state;
            yellow_state ? id(yellow_led_output).turn_on() : id(yellow_led_output).turn_off();
          }
          
          // Red LED
          if (id(red_blink_mode) == 0) {
            id(red_led_output).turn_off();
            red_counter = 0;
            red_state = false;
          } else if (id(red_blink_mode) == 1) {
            id(red_led_output).turn_on();
            red_counter = 0;
          } else if (id(red_blink_mode) == 2) {
            if (red_counter >= 5) {
              red_counter = 0;
              red_state = !red_state;
              red_state ? id(red_led_output).turn_on() : id(red_led_output).turn_off();
            }
          } else if (id(red_blink_mode) == 3) {
            red_state = !red_state;
            red_state ? id(red_led_output).turn_on() : id(red_led_output).turn_off();
          }

  - interval: 1min
    then:
      - lambda: |-
          if(id(pump_interval).state){
            id(pump_time_tmp)=id(pump_time_tmp)+1;
            if(id(Pump).state){
              if(id(pump_time_tmp)>=int(id(pump_on).state)){
                id(Pump).turn_off();
                id(pump_time_tmp)=0;
              }
            } else {
              if(id(pump_time_tmp)>=int(id(pump_off).state)){
                id(Pump).turn_on();
                id(pump_time_tmp)=0;
              }
            }
          }
          
          


